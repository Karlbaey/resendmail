name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported tag format: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.tag }}"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "$dist_dir"

          targets=(
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "windows amd64 zip"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch archive <<< "$target"

            base="resendmail_${version}_${goos}_${goarch}"
            stage_root="$(mktemp -d)"
            package_dir="${stage_root}/${base}"
            binary_name="resendmail"

            if [[ "$goos" == "windows" ]]; then
              binary_name="${binary_name}.exe"
            fi

            mkdir -p "$package_dir"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "${package_dir}/${binary_name}" .

            cp README.md "${package_dir}/README.md"

            if [[ "$archive" == "tar.gz" ]]; then
              tar -C "$stage_root" -czf "${dist_dir}/${base}.tar.gz" "$base"
            else
              (
                cd "$stage_root"
                zip -qr "${dist_dir}/${base}.zip" "$base"
              )
            fi

            rm -rf "$stage_root"
          done

          (
            cd "$dist_dir"
            sha256sum * > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.meta.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
